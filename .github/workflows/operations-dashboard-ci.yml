name: Operations Dashboard CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - name: Generate diagnostic acceptance packet (not production approval)
        shell: bash
        run: npm run accept:packet > acceptance-packet.json
      - name: Verify diagnostic packet integrity
        shell: bash
        run: npm run accept:verify -- acceptance-packet.json > acceptance-verification.json
      - name: Upload OS-specific diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: hak-diagnostic-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            acceptance-packet.json
            acceptance-verification.json
          if-no-files-found: error
          retention-days: 30
