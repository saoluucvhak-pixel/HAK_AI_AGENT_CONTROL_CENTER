name: Operations Dashboard CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - name: Run isolated real HTTP operator smoke
        run: node scripts/accept-windows-smoke.mjs
      - name: Verify synthetic Observer backup, SHA256 and restore replay
        run: npm run accept:observer-backup
      - name: Run isolated one-click acceptance (including restart and backup)
        run: npm run accept:auto
      - name: Verify one-click agent readiness in isolated unconfigured mode
        run: node scripts/accept-agent-readiness.mjs
      - name: Generate diagnostic acceptance packet (not production approval)
        shell: bash
        run: node scripts/accept-packet.mjs > acceptance-packet.json
      - name: Verify diagnostic packet integrity
        shell: bash
        run: node scripts/verify-acceptance-packet.mjs acceptance-packet.json > acceptance-verification.json
      - name: Record exact checked-out commit and runner metadata
        run: node scripts/write-ci-provenance.mjs
      - name: Verify checked-out SHA and main push release gate
        run: node scripts/verify-ci-provenance.mjs ci-provenance.json
      - name: Upload OS-specific diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: hak-diagnostic-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            acceptance-packet.json
            acceptance-verification.json
            ci-provenance.json
          if-no-files-found: error
          retention-days: 30
