name: Windows 11 Isolated Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hak-win11-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, hak-win11-isolated]
    environment: hak-win11-acceptance
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact main SHA
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Only main is permitted' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'Checked out SHA does not match GitHub SHA' }
      - name: Run static checks and tests
        run: npm run check
      - run: npm test
      - name: Run disposable local dashboard smoke
        run: node scripts/accept-windows-smoke.mjs
      - name: Export redacted non-sensitive runner metadata
        shell: pwsh
        run: |
          $record = @{
            kind = 'hak-isolated-win11-ci'
            commitSha = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            os = [System.Environment]::OSVersion.VersionString
            node = (node --version)
            productionApproved = $false
          }
          $record | ConvertTo-Json | Out-File -FilePath win11-runner-evidence.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: hak-win11-isolated-smoke
          path: win11-runner-evidence.json
          if-no-files-found: error
          retention-days: 14
